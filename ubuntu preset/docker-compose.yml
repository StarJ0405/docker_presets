version: "3.8"

services:
  b16:
    build:
      context: .
      args:
        - NODE_VERSION=16
    image: ${IMAGE_NAME:-ubuntu_base}:16

  b20:
    build:
      context: .
      args:
        - NODE_VERSION=20
    image: ${IMAGE_NAME:-ubuntu_base}:20

  b24:
    build:
      context: .
      args:
        - NODE_VERSION=24
    image: ${IMAGE_NAME:-ubuntu_base}:24

  lts:
    build:
      context: .
      args:
        - NODE_VERSION=lts
    image: ${IMAGE_NAME:-ubuntu_base}:latest
